# Jarvis/Uplift four-line keypad scanner for stock Upsy Desky wiring.
# Every stable nonzero mask/source change emits, without waiting for release.
packages:
  keypad_events: !include keypad-events.yaml

substitutions:
  # Disable for an unverified keypad: no GPIO observation or input enablement.
  # Movement and preset outputs remain open-drain independently of scanning.
  upsy_keypad_gpio_enabled: "true"
  upsy_keypad_scan_interval: "20ms"
  upsy_keypad_debounce_ms: "30"

  # Event types can be overridden from the consuming configuration.
  upsy_keypad_event_up: "up"
  upsy_keypad_event_down: "down"
  upsy_keypad_event_preset_1: "preset_1"
  upsy_keypad_event_preset_2: "preset_2"
  upsy_keypad_event_preset_3: "preset_3"
  upsy_keypad_event_preset_4: "preset_4"
  upsy_keypad_event_memory: "memory"
  upsy_keypad_event_unknown: "unknown"

  # Masks use button_bit1_pin/button_bit2_pin/button_bit4_pin/button_m_pin.
  # Defaults match the existing Upsy preset outputs (Jarvis/Uplift wiring).
  # Override these for a handset with different button encoding.
  upsy_keypad_up_mask: "0x01"
  upsy_keypad_down_mask: "0x02"
  upsy_keypad_preset_1_mask: "0x03"
  upsy_keypad_preset_2_mask: "0x04"
  upsy_keypad_preset_3_mask: "0x06"
  upsy_keypad_preset_4_mask: "0x05"
  upsy_keypad_memory_mask: "0x08"
  # Physical handsets may combine Memory with another line. Firmware store
  # commands still use upsy_keypad_memory_mask, matching the preset outputs.
  upsy_keypad_physical_memory_mask: "0x0A"

esphome:
  # Read open-drain output latches to distinguish firmware and handset activity.
  includes:
    - <soc/gpio_struct.h>

event:
  - id: !extend upsy_keypad_button_event
    event_types:
      - "${upsy_keypad_event_up}"
      - "${upsy_keypad_event_down}"
      - "${upsy_keypad_event_preset_1}"
      - "${upsy_keypad_event_preset_2}"
      - "${upsy_keypad_event_preset_3}"
      - "${upsy_keypad_event_preset_4}"
      - "${upsy_keypad_event_memory}"
      - "${upsy_keypad_event_unknown}"

# Enable observation on every output sharing a handset line. Open-drain output
# mode is provided by base.yaml and presets.yaml independently of this addon.
output:
  - id: !extend standing_desk_up_pin
    pin:
      number: ${standing_desk_up_pin}
      allow_other_uses: true
      mode:
        input: ${upsy_keypad_gpio_enabled}

  - id: !extend standing_desk_down_pin
    pin:
      number: ${standing_desk_down_pin}
      allow_other_uses: true
      mode:
        input: ${upsy_keypad_gpio_enabled}

  - id: !extend button_bit1
    pin:
      number: ${button_bit1_pin}
      allow_other_uses: true
      mode:
        input: ${upsy_keypad_gpio_enabled}

  - id: !extend button_bit2
    pin:
      number: ${button_bit2_pin}
      allow_other_uses: true
      mode:
        input: ${upsy_keypad_gpio_enabled}

  - id: !extend button_bit4
    pin:
      number: ${button_bit4_pin}
      mode:
        input: ${upsy_keypad_gpio_enabled}

  - id: !extend button_m
    pin:
      number: ${button_m_pin}
      mode:
        input: ${upsy_keypad_gpio_enabled}

# Scanner/debouncer state. Source values are:
# 0 = idle, 1 = physical keypad, 2 = firmware-driven GPIO, 3 = mixed/ambiguous.
globals:
  - id: upsy_keypad_candidate_mask
    type: uint8_t
    restore_value: no
    initial_value: '0'

  - id: upsy_keypad_stable_mask
    type: uint8_t
    restore_value: no
    initial_value: '0'

  - id: upsy_keypad_candidate_since
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: upsy_keypad_candidate_source
    type: uint8_t
    restore_value: no
    initial_value: '0'

  - id: upsy_keypad_stable_source
    type: uint8_t
    restore_value: no
    initial_value: '0'

interval:
  - id: upsy_keypad_simple_scan
    interval: ${upsy_keypad_scan_interval}
    startup_delay: 250ms
    then:
      - lambda: |-
          if (!${upsy_keypad_gpio_enabled}) {
            id(upsy_keypad_simple_scan).stop_poller();
            return;
          }

          const int pins[] = {
              ${button_bit1_pin}, ${button_bit2_pin},
              ${button_bit4_pin}, ${button_m_pin}};
          // Sample each bank once so lines in the same bank share a snapshot.
          const uint32_t levels[] = {GPIO.in, GPIO.in1.val};
          const uint32_t latches[] = {GPIO.out, GPIO.out1.val};
          uint8_t raw_mask = 0;
          uint8_t firmware_mask = 0;
          for (int bit = 0; bit < 4; ++bit) {
            const int pin = pins[bit];
            const uint32_t pin_mask = 1UL << (pin % 32);
            if ((levels[pin / 32] & pin_mask) == 0) {
              raw_mask |= 1U << bit;
            }
            // Open-drain latch: zero drives low, one releases the wire.
            if ((latches[pin / 32] & pin_mask) == 0) {
              firmware_mask |= 1U << bit;
            }
          }

          const uint8_t external_mask = raw_mask & ~firmware_mask;
          uint8_t source = 0;
          if (firmware_mask != 0) {
            source = external_mask != 0 ? 3 : 2;
          } else if (raw_mask != 0) {
            source = 1;
          }
          const uint8_t mask = source == 2 ? firmware_mask : raw_mask;
          if (mask != id(upsy_keypad_candidate_mask) ||
              source != id(upsy_keypad_candidate_source)) {
            id(upsy_keypad_candidate_mask) = mask;
            id(upsy_keypad_candidate_source) = source;
            id(upsy_keypad_candidate_since) = millis();
            return;
          }
          if (mask == id(upsy_keypad_stable_mask) &&
              source == id(upsy_keypad_stable_source)) {
            return;
          }
          if (static_cast<uint32_t>(millis() - id(upsy_keypad_candidate_since)) <
              ${upsy_keypad_debounce_ms}U) {
            return;
          }
          id(upsy_keypad_stable_mask) = mask;
          id(upsy_keypad_stable_source) = source;
          if (mask == 0) {
            return;
          }

          std::string button_name = "${upsy_keypad_event_unknown}";
          if (source != 3) {
            if (source == 1 && mask == ${upsy_keypad_physical_memory_mask}) {
              button_name = "${upsy_keypad_event_memory}";
            } else {
              switch (mask) {
                case ${upsy_keypad_up_mask}: button_name = "${upsy_keypad_event_up}"; break;
                case ${upsy_keypad_down_mask}: button_name = "${upsy_keypad_event_down}"; break;
                case ${upsy_keypad_preset_1_mask}: button_name = "${upsy_keypad_event_preset_1}"; break;
                case ${upsy_keypad_preset_2_mask}: button_name = "${upsy_keypad_event_preset_2}"; break;
                case ${upsy_keypad_preset_3_mask}: button_name = "${upsy_keypad_event_preset_3}"; break;
                case ${upsy_keypad_preset_4_mask}: button_name = "${upsy_keypad_event_preset_4}"; break;
                case ${upsy_keypad_memory_mask}:
                  if (source == 2) button_name = "${upsy_keypad_event_memory}";
                  break;
              }
            }
          }
          const char *source_name = source == 1 ? "physical_keypad" :
                                    source == 2 ? "virtual_control" : "mixed_input";
          id(upsy_keypad_publish_action)->execute(button_name, raw_mask, source_name);
