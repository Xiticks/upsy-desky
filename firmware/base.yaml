# Essential ESPHome config options
esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  min_version: "2024.6.0"
  on_boot:
    # Let shared handset GPIOs settle before requesting the first height report.
    - priority: 500
      then:
        - delay: 250ms
        - uart.write:
            id: handset_tx
            data: [ 0x0 ]
        - if:
            condition:
              lambda: 'return std::string("${standing_desk_variant}") == "auto";'
            then:
              - standing_desk_height.detect_decoder: desk_height
  project:
    name: tj_horner.upsy_desky
    version: "5.0.2"

uart:
  id: handset_tx
  tx_pin: 16
  baud_rate: 9600

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Configurable options
substitutions:
  name: "upsy-desky"
  friendly_name: "Upsy Desky"
  desk_height_name: "Desk Height"
  target_desk_height_name: "Target Desk Height"

  # Standing Desk Component Config
  standing_desk_uart_rx_pin: "17"
  standing_desk_up_pin: "21"
  standing_desk_down_pin: "22"
  standing_desk_variant: "auto"
  standing_desk_min_height: "25.2"
  standing_desk_max_height: "50.8"

  # Presets Addon Config
  button_bit1_pin: "21"
  button_bit2_pin: "22"
  button_bit4_pin: "19"
  button_m_pin: "18"

packages:
  standing_desk: github://tjhorner/esphome-standing-desk/configs/template.yaml
  addon_presets: !include addons/presets.yaml
  # Stock Jarvis/Uplift keypad wiring; independent of the height decoder.
  addon_button_record: !include addons/button-record-simple.yaml
  addon_stable_ids: !include addons/stable-ids.yaml
  addon_runtime_config: !include addons/runtime-config.yaml

button:
  - platform: restart
    name: "Restart"

# Upstream auto-detection gives each decoder one second, then stops reading
# heights after a failed cycle. Retry only until the first valid height arrives.
# This uses the existing action and leaves explicitly selected decoders alone.
interval:
  - interval: 5s
    startup_delay: 5s
    then:
      - if:
          condition:
            lambda: |-
              return std::string("${standing_desk_variant}") == "auto" &&
                     id(desk_height)->get_last_read() < 0;
          then:
            - standing_desk_height.detect_decoder: desk_height
            - uart.write:
                id: handset_tx
                data: [ 0x0 ]

light:
  - platform: status_led
    id: upsy_desky_status_led
    name: "Status LED"
    pin: GPIO23
    restore_mode: RESTORE_DEFAULT_ON
